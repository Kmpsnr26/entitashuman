name: Private source security

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: private-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript and workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Semgrep Community Edition
        run: python -m pip install semgrep==1.179.0
      - name: Scan JavaScript and GitHub workflows
        run: >-
          semgrep scan
          --config p/javascript
          --config p/github-actions
          --exclude 'dist/**'
          --exclude 'sites/**/dist/**'
          --metrics=off
          --error
