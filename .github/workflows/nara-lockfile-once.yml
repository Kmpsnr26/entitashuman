name: NARA Lockfile Once

on:
  push:
    branches:
      - codex/nara-cloud-humanale-bridge-phase11g-clean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate deterministic NARA lockfile
        working-directory: nara-cloud
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: nara-cloud-package-lock
          path: nara-cloud/package-lock.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: codex/nara-cloud-humanale-bridge-phase11g-clean

      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: nara-cloud-package-lock
          path: nara-cloud

      - name: Commit lockfile only if changed
        shell: bash
        run: |
          set -euo pipefail
          git add nara-cloud/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock NARA Cloud dependency graph"
          git push origin HEAD:codex/nara-cloud-humanale-bridge-phase11g-clean
