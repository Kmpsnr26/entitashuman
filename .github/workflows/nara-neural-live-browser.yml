# Realtime WebGL acceptance for NARA Neural Space
name: NARA Neural Live Browser Smoke

on:
  push:
    branches:
      - codex/nara-neural-space-3d-stage1
    paths:
      - 'nara-core/studio/**'
      - 'scripts/nara-neural-live-smoke.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/nara-neural-live-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    name: Electron WebGL live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ELECTRON_ENABLE_LOGGING: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Xvfb
        run: command -v xvfb-run

      - name: Run realtime Electron WebGL smoke
        run: xvfb-run -a --server-args="-screen 0 1440x960x24" npm run smoke:neural-live

      - name: Upload live visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nara-neural-live-browser
          path: |
            artifacts/nara-neural-live.png
            artifacts/nara-neural-live-report.json
          if-no-files-found: warn
          retention-days: 7
