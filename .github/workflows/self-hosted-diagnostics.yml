name: Self-hosted diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-self-hosted:
    name: Windows self-hosted full verification
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify tests and build
        run: npm run verify
      - name: Smoke interactive terminal
        run: npm run smoke:terminal
      - name: Dependency audit
        run: npm audit --audit-level=high
