name: Verify and package

on:
  workflow_dispatch:
    inputs:
      build_signed_artifact:
        description: "Build and verify signed Windows artifacts without publishing"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Publish verified Windows artifacts to the GitHub release"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Require main for signed builds
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed_artifact || inputs.publish_release)
        run: test "$GITHUB_REF_NAME" = main
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify tests and build
        run: npm run verify
      - name: Audit high severity
        run: npm audit --audit-level=high

  windows:
    name: Windows runtime and package
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require main for signed builds
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed_artifact || inputs.publish_release)
        run: if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Signed builds require main.' }
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Smoke interactive Windows terminal
        run: npm run smoke:terminal
      - name: Package portable desktop
        run: npm run package:desktop
      - name: Smoke packaged desktop
        run: .\HumanALE-God-Engine-Desktop\HumanALE-God-Engine.exe --ci-smoke
      - name: Require Windows signing material
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed_artifact || inputs.publish_release)
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) { throw "Missing required Actions secret: WINDOWS_SIGNING_PFX_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) { throw "Missing required Actions secret: WINDOWS_SIGNING_PFX_PASSWORD" }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
          $pfx = Join-Path $env:RUNNER_TEMP "humanale-signing.pfx"
          [IO.File]::WriteAllBytes($pfx,$bytes)
          if (-not (Test-Path $pfx) -or (Get-Item $pfx).Length -lt 100) { throw "Windows signing certificate payload is invalid." }
      - name: Sign portable desktop executable
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed_artifact || inputs.publish_release)
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "humanale-signing.pfx"
          $exe = "HumanALE-God-Engine-Desktop\HumanALE-God-Engine.exe"
          if (-not (Test-Path $exe)) { throw "Portable HumanALE executable not found for signing." }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on Windows runner." }
          & $signtool.FullName sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { throw "Portable HumanALE Authenticode signing failed." }
      - name: Build assisted Windows installer
        if: github.event_name != 'workflow_dispatch' || (inputs.build_signed_artifact != true && inputs.publish_release != true)
        run: npm run package:installer
      - name: Build signed Windows installer
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed_artifact || inputs.publish_release)
        env:
          CSC_LINK: ${{ runner.temp }}/humanale-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: npm run package:installer
      - name: Prepare and validate release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-ChildItem release -Filter "HumanALE-God-Engine-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer HumanALE god egine tidak ditemukan." }
          if ($installer.Length -lt 1000000) { throw "Installer HumanALE god egine terlalu kecil dan kemungkinan tidak lengkap." }
          $zip = "release\HumanALE-God-Engine-Portable-$version-x64.zip"
          Compress-Archive -Path "HumanALE-God-Engine-Desktop\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "Portable ZIP tidak ditemukan." }
          Write-Host "Installer ready: $($installer.FullName) ($($installer.Length) bytes)"
          Write-Host "Portable package: $zip"
      - name: Verify Windows Authenticode
        if: github.event_name == 'workflow_dispatch' && (inputs.build_signed_artifact || inputs.publish_release)
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "HumanALE-God-Engine-Setup-*-x64.exe" | Select-Object -First 1
          $portableExe = "HumanALE-God-Engine-Desktop\HumanALE-God-Engine.exe"
          foreach ($target in @($installer.FullName,$portableExe)) {
            $signature = Get-AuthenticodeSignature -FilePath $target
            Write-Host "Authenticode $target => $($signature.Status)"
            if ($signature.Status -ne "Valid") { throw "Authenticode verification failed for $target: $($signature.Status)" }
            if (-not $signature.SignerCertificate) { throw "Signer certificate missing for $target." }
          }
      - name: Remove Windows signing material
        if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.build_signed_artifact || inputs.publish_release) }}
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "humanale-signing.pfx") -Force -ErrorAction SilentlyContinue
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HumanALE-Windows-${{ github.sha }}
          path: |
            release/HumanALE-God-Engine-Setup-*-x64.exe
            release/HumanALE-God-Engine-Portable-*-x64.zip
          if-no-files-found: error
          retention-days: 30

  release-windows:
    name: Publish verified Windows release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Enforce release publication gate
        run: node scripts/humanale-release-publication-gate.mjs
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: HumanALE-Windows-${{ github.sha }}
          path: release
      - name: Validate and publish Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          installer=$(find release -maxdepth 1 -type f -name 'HumanALE-God-Engine-Setup-*-x64.exe' | head -n 1)
          portable=$(find release -maxdepth 1 -type f -name 'HumanALE-God-Engine-Portable-*-x64.zip' | head -n 1)
          test -n "$installer" -a -f "$installer"
          test -n "$portable" -a -f "$portable"
          git fetch --tags --force
          if gh release view "$tag" >/dev/null 2>&1; then
            tag_sha=$(git rev-list -n 1 "$tag")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Release $tag already targets $tag_sha. Bump package.json before publishing a different commit."
              exit 1
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "HumanALE god egine $tag" --notes "Verified Windows x64 installer/portable release. Android signed APK may be attached separately after its signing gate passes."
          fi
          gh release upload "$tag" "$installer" "$portable" --clobber
