name: Verify and package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish verified Windows artifacts to the GitHub release"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify tests and build
        run: npm run verify
      - name: Audit high severity
        run: npm audit --audit-level=high

  windows:
    name: Windows runtime and package
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Smoke interactive Windows terminal
        run: npm run smoke:terminal
      - name: Package portable desktop
        run: npm run package:desktop
      - name: Smoke packaged desktop
        run: .\HumanALE-God-Engine-Desktop\HumanALE-God-Engine.exe --ci-smoke
      - name: Build assisted Windows installer
        run: npm run package:installer
      - name: Prepare and validate release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-ChildItem release -Filter "HumanALE-God-Engine-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer HumanALE god egine tidak ditemukan." }
          if ($installer.Length -lt 1000000) { throw "Installer HumanALE god egine terlalu kecil dan kemungkinan tidak lengkap." }
          $zip = "release\HumanALE-God-Engine-Portable-$version-x64.zip"
          Compress-Archive -Path "HumanALE-God-Engine-Desktop\*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "Portable ZIP tidak ditemukan." }
          Write-Host "Installer ready: $($installer.FullName) ($($installer.Length) bytes)"
          Write-Host "Portable package: $zip"
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HumanALE-Windows-${{ github.sha }}
          path: |
            release/HumanALE-God-Engine-Setup-*-x64.exe
            release/HumanALE-God-Engine-Portable-*-x64.zip
          if-no-files-found: error
          retention-days: 30

  release-windows:
    name: Publish verified Windows release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: HumanALE-Windows-${{ github.sha }}
          path: release
      - name: Validate and publish Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          installer=$(find release -maxdepth 1 -type f -name 'HumanALE-God-Engine-Setup-*-x64.exe' | head -n 1)
          portable=$(find release -maxdepth 1 -type f -name 'HumanALE-God-Engine-Portable-*-x64.zip' | head -n 1)
          test -n "$installer" -a -f "$installer"
          test -n "$portable" -a -f "$portable"
          git fetch --tags --force
          if gh release view "$tag" >/dev/null 2>&1; then
            tag_sha=$(git rev-list -n 1 "$tag")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Release $tag already targets $tag_sha. Bump package.json before publishing a different commit."
              exit 1
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "HumanALE god egine $tag" --notes "Verified Windows x64 installer/portable release. Android signed APK may be attached separately after its signing gate passes."
          fi
          gh release upload "$tag" "$installer" "$portable" --clobber
