# Repository-only staging reverse-proxy template. Do not enable until DNS,
# TLS certificates, and hosting changes are separately authorized.
# The certificate paths below are examples, not existing credentials.
# Backend services must bind to loopback only (127.0.0.1).
server {
  listen 443 ssl;
  server_name staging-auth.aleprinting.my.id;

  ssl_certificate /etc/letsencrypt/live/staging-auth.aleprinting.my.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging-auth.aleprinting.my.id/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}

server {
  listen 443 ssl;
  server_name staging-nara.aleprinting.my.id;

  ssl_certificate /etc/letsencrypt/live/staging-nara.aleprinting.my.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging-nara.aleprinting.my.id/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
